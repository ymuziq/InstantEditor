<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#141414" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>InstantEditor</title>
</head>
<body>
  <header><div><strong>InstantEditor</strong></div><div class="header-actions"><div class="lang-switch" role="group" aria-label="Language"><button id="langKo" type="button" data-lang="ko" aria-pressed="true">KO</button><button id="langEn" type="button" data-lang="en" aria-pressed="false">EN</button></div><button id="clearPhoto" type="button" data-i18n="clearPhoto" disabled>사진 초기화</button><label class="upload"><span data-i18n="open">사진 불러오기</span><input id="file" type="file" accept="image/*" hidden /></label></div></header>
  <main>
    <section class="preview-section">
      <div class="panel source-panel"><div class="sectionhead"><b data-i18n="sourceHeading">원본 · 사진 영역</b><button id="detect" data-i18n="detect" disabled>자동 검출</button></div><div class="canvasbox"><canvas id="source"></canvas></div><p class="hint" data-i18n="dragHint">초록색 모서리 또는 변을 손가락으로 드래그하세요.</p></div>
      <div class="panel result-panel"><div class="sectionhead"><b data-i18n="resultHeading">최종 결과</b><span id="dimensions">1080 × 1350</span></div><div class="canvasbox"><canvas id="result"></canvas></div></div>
    </section>
    <section class="settings panel">
      <h2 data-i18n="layout">레이아웃</h2>
      <label class="field"><span data-i18n="ratio">출력 비율</span><select id="ratio"><option value="4:5" data-i18n="ratioInstagram">4:5 (인스타그램)</option><option value="1:1" data-i18n="ratioSquare">1:1 (정사각형)</option><option value="3:4" data-i18n="ratioPortrait">3:4 (세로)</option><option value="2:3" data-i18n="ratioPortrait2">2:3 (세로)</option><option value="9:16" data-i18n="ratioStory">9:16 (스토리)</option><option value="3:2" data-i18n="ratioLandscape">3:2 (가로)</option><option value="16:9" data-i18n="ratioWide">16:9 (가로)</option></select></label>
      <label class="field"><span data-i18n="size">중앙 사진 너비</span> <output id="sizeVal">72%</output><input id="size" type="range" min="35" max="95" value="72" /></label>
      <h2 data-i18n="backgroundHeading">배경 종류</h2>
      <label class="field"><span data-i18n="backgroundChoice">배경 선택</span><select id="bgMode"><option value="photo" data-i18n="photoMode">사진 확대</option><option value="texture" data-i18n="textureMode">재질 배경</option></select></label>
      <div id="photoOptions">
      <h2 data-i18n="photoHeading">사진 확대 배경</h2>
      <label class="field"><span data-i18n="zoom">배경 확대</span> <output id="zoomVal">100%</output><input id="zoom" type="range" min="100" max="240" value="100" /></label>
      <label class="field"><span data-i18n="moveX">좌우 이동</span> <output id="moveXVal">0%</output><input id="moveX" type="range" min="-100" max="100" value="0" /></label>
      <label class="field"><span data-i18n="moveY">상하 이동</span> <output id="moveYVal">0%</output><input id="moveY" type="range" min="-100" max="100" value="0" /></label>
      <label class="field"><span data-i18n="brightness">밝기</span> <output id="brightnessVal">85%</output><input id="brightness" type="range" min="20" max="120" value="85" /></label>
      <label class="field"><span data-i18n="blur">배경 블러</span> <output id="blurVal">10</output><input id="blur" type="range" min="0" max="20" value="10" /></label>
      </div>
      <div id="textureOptions" hidden>
        <h2 data-i18n="textureHeading">재질 배경</h2>
        <label class="field"><span data-i18n="textureKind">재질 종류</span><select id="textureKind"><option value="concrete" data-i18n="concrete">콘크리트</option><option value="marble" data-i18n="marble">대리석</option><option value="paper" data-i18n="paper">빈티지 종이</option><option value="stone" data-i18n="stone">어두운 석재</option></select></label>
        <label class="field"><span data-i18n="textureStrength">질감 강도</span> <output id="textureStrengthVal">20%</output><input id="textureStrength" type="range" min="0" max="100" value="20" /></label>
        <label class="field"><span data-i18n="textureScale">무늬 크기</span> <output id="textureScaleVal">35%</output><input id="textureScale" type="range" min="20" max="200" value="35" /></label>
        <label class="field"><span data-i18n="textureColor">배경 색상</span> <input id="textureColor" type="color" value="#5d5d5d" /></label>
        <button id="newPattern" type="button" data-i18n="newPattern">새로운 패턴 생성</button>
      </div>
      <div class="actions"><button id="reset" data-i18n="reset">레이아웃 초기화</button><button id="save" data-i18n="save" disabled>JPEG 저장</button></div>
      <p class="hint" data-i18n="footerHint">재질 배경 4종을 지원합니다. 브라우저와 PC 버전의 이미지 처리 방식이 달라 결과가 완전히 같지는 않을 수 있습니다.</p>
    </section>
  </main>
  <div id="status" role="status" data-i18n="startStatus">사진을 불러오면 편집할 수 있어요.</div>
  <script src="app.js" defer></script>
</body>
</html>
